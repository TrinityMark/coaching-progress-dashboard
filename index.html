<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching Progress Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #1f2937; }

        header { background: #15397F; color: #fff; padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        .version { font-size: 0.75rem; opacity: 0.6; letter-spacing: 0.03em; }

        main { padding: 24px 28px; }

        /* Loading / error states */
        #state-loading { display: flex; align-items: center; gap: 10px; color: #6b7280; padding: 40px 0; }
        #state-error   { display: none; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 16px; color: #b91c1c; }
        #state-table   { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 20px; height: 20px; border: 3px solid #e5e7eb; border-top-color: #15397F; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

        /* Controls bar */
        .controls { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
        .controls h2 { font-size: 1rem; font-weight: 600; color: #374151; }
        #client-count { font-size: 0.82rem; font-weight: 400; color: #9ca3af; margin-left: 6px; }
        .controls select {
            font-size: 0.82rem; border: 1px solid #d1d5db; border-radius: 4px;
            padding: 5px 10px; background: #fff; cursor: pointer; color: #374151;
        }
        .legend { display: flex; gap: 14px; font-size: 0.75rem; color: #6b7280; margin-left: auto; }
        .legend span { display: flex; align-items: center; gap: 5px; }

        /* Table */
        .table-wrap { overflow: auto; max-height: calc(100vh - 230px); background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
        table { border-collapse: collapse; font-size: 0.82rem; }

        th.fixed-th {
            text-align: left; padding: 9px 14px; background: #f9fafb; color: #374151;
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 2px solid #e5e7eb; white-space: nowrap;
            position: sticky; top: 0; z-index: 6;
        }
        th.group-th {
            text-align: center; padding: 6px 4px; font-size: 0.72rem; font-weight: 600; color: #fff;
            border-left: 1px solid rgba(255,255,255,0.25); border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
            position: sticky; top: 0; z-index: 5;
        }
        th.count-th {
            text-align: center; padding: 1px 2px; white-space: nowrap;
            border-left: 1px solid #f0f0f0;
            font-size: 0.65rem; font-weight: 700;
            position: sticky;
        }
        th.count-th-done { background: #dcfce7; color: #15803d; top: var(--r1h, 28px); z-index: 4; }
        th.count-th-book { background: #fef3c7; color: #92400e; top: var(--r2h, 44px); z-index: 3; }
        th.count-th-notcomp { background: #fee2e2; color: #dc2626; top: var(--r3h, 60px); z-index: 2; border-bottom: 2px solid #e5e7eb; }
        th.session-th {
            text-align: center; padding: 4px 3px; font-size: 0.7rem; color: #6b7280; font-weight: 600;
            min-width: 36px; border-left: 1px solid #f0f0f0; border-bottom: 2px solid #e5e7eb;
            background: #fff;
            position: sticky; top: var(--r4h, 76px); z-index: 1;
        }

        td { padding: 8px 14px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; color: #374151; }
        td.session-td { text-align: center; padding: 4px 2px; min-width: 36px; border-left: 1px solid #f3f4f6; }
        td.ks-prior { background: #f0fdf4; }

        /* Frozen first two columns (Client, Location) */
        th.fixed-th:nth-child(1), th.fixed-th:nth-child(2) { position: sticky; left: 0; z-index: 7; }
        th.fixed-th:nth-child(2) { left: var(--c1w, 140px); }
        td:nth-child(1), td:nth-child(2) {
            position: sticky; left: 0; z-index: 1; background: #fff;
            box-shadow: 1px 0 0 #f3f4f6;
        }
        td:nth-child(2) { left: var(--c1w, 140px); }
        tbody tr:nth-child(even) td:nth-child(1),
        tbody tr:nth-child(even) td:nth-child(2) { background: #fafafa; }
        tbody tr:hover td:nth-child(1),
        tbody tr:hover td:nth-child(2) { background: #eff6ff; }

        .tick       { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 4px; background: #dcfce7; color: #15803d; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .dot        { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 4px; background: #fef3c7; color: #92400e; font-size: 1.1rem; line-height: 1; cursor: pointer; }
        .cross      { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 4px; background: #fee2e2; color: #dc2626; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .count-done { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; border-radius: 4px; background: #dcfce7; color: #15803d; font-size: 0.75rem; font-weight: 700; padding: 0 4px; }
        .count-book { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; border-radius: 4px; background: #fef3c7; color: #92400e; font-size: 0.75rem; font-weight: 700; padding: 0 4px; }

        /* Action popup (appears when clicking a booked dot) */
        #action-popup { position: fixed; display: none; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); padding: 10px 12px; z-index: 9999; }
        #action-popup .popup-label { font-size: 0.7rem; color: #6b7280; font-weight: 600; margin-bottom: 8px; }
        #action-popup .popup-btns  { display: flex; gap: 8px; }
        .popup-btn          { border: none; border-radius: 4px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .popup-btn-complete { background: #dcfce7; color: #15803d; }
        .popup-btn-complete:hover { background: #bbf7d0; }
        .popup-btn-dna      { background: #fee2e2; color: #dc2626; }
        .popup-btn-dna:hover { background: #fecaca; }

        tbody tr:nth-child(even) { background: #fafafa; }
        tbody tr:hover { background: #eff6ff; }


        th.group-th { cursor: pointer; }

        th.session-th.expanded {
            white-space: normal; min-width: 80px; max-width: 130px;
            font-size: 0.65rem; line-height: 1.3; vertical-align: bottom;
            padding: 6px 4px;
        }

        /* Tooltip */
        #tooltip {
            position: fixed; display: none; pointer-events: none;
            background: #1f2937; color: #fff; font-size: 0.75rem;
            padding: 5px 10px; border-radius: 4px; white-space: nowrap;
            z-index: 9998; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<header>
    <h1>Coaching Progress Dashboard</h1>
    <span class="version">v1.7</span>
</header>

<main>
    <div id="state-loading">
        <div class="spinner"></div>
        <span>Loading clients…</span>
    </div>

    <div id="state-error"></div>

    <div id="state-table">
        <div class="controls">
            <h2>Packaged Clients <span id="client-count"></span></h2>
            <select id="filter-location" onchange="applyFilter(document.getElementById('filter-senior').value)">
                <option value="">All Locations</option>
            </select>
            <select id="filter-senior" onchange="applyFilter(this.value)">
                <option value="">All Seniors</option>
            </select>
            <select id="filter-course" onchange="onCourseFilterChange()">
                <option value="">All Courses</option>
            </select>
            <select id="filter-completion" onchange="applyFilter(document.getElementById('filter-senior').value)" style="display:none">
                <option value="">Any status</option>
                <option value="completed">Completed</option>
                <option value="notcompleted">Not Completed</option>
            </select>
            <button onclick="clearFilters()" style="font-size:0.82rem;border:1px solid #d1d5db;border-radius:4px;padding:5px 10px;background:#fff;cursor:pointer;color:#6b7280;">Clear filters</button>
            <div class="legend">
                <span><span class="tick"  style="width:16px;height:16px;font-size:0.65rem">✓</span> Completed</span>
                <span><span class="dot"   style="width:16px;height:16px;font-size:0.9rem">·</span> Booked</span>
                <span><span class="cross" style="width:16px;height:16px;font-size:0.7rem">✗</span> Did not attend</span>
            </div>
        </div>

        <div class="table-wrap">
            <table id="main-table">
                <thead id="t-head"></thead>
                <tbody id="t-body"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="action-popup">
    <div class="popup-label">Mark as:</div>
    <div class="popup-btns">
        <button class="popup-btn popup-btn-complete" id="popup-complete">&#10003; Completed</button>
        <button class="popup-btn popup-btn-dna"      id="popup-dna">&#10007; Did not attend</button>
    </div>
</div>

<div id="tooltip"></div>


<script src="config.js"></script>
<script>
// ── CLIENTS_FLOW_URL is defined in config.js (gitignored) ─────────────────

// ── Course groups ──────────────────────────────────────────────────────────
const COURSE_GROUPS = [
    { name: 'Business Alignment', color: '#1d4ed8', courses: [
        'Business Alignment Part 1, Sweet Spot Assessment',
        'Business Alignment Part 2, Top Clients & Wishlist Interviews',
        'Business Alignment Part 3, AOI, USP, Tagline',
        'Business Alignment Part 4, Systemisation Session 1',
        'Business Alignment Part 5, Systemisation Session 2',
    ]},
    { name: 'Marketing', color: '#7c3aed', courses: [
        'Marketing Part 1, Marketing Foundations',
        'Marketing Part 2, Sales & Client Retention',
    ]},
    { name: 'Leadership 1', color: '#047857', courses: [
        'Leadership and Culture Phase 1 Part 1, Setting Solid Foundations for Success',
        'Leadership and Culture Phase 1 Part 2, Communication: Getting It Right',
        'Leadership and Culture Phase 1 Part 3, Developing Emotional Intelligence',
        'Leadership and Culture Phase 1 Part 4, Building Habits of Highly Successful Leaders',
        'Leadership and Culture Phase 1 Part 5, Prioritisation: How to Focus When Everything Is Urgent',
        'Leadership and Culture Phase 1 Part 6, Personal Brand Development',
    ]},
    { name: 'Leadership 2', color: '#065f46', courses: [
        'Leadership and Culture Phase 2 Part 1, Effective Feedback and Managing Continuing Underperformance',
        'Leadership and Culture Phase 2 Part 2, Delegate Effectively and Run Productive Meetings',
        'Leadership and Culture Phase 2 Part 3, Lead Change and Resolve Conflict',
        'Leadership and Culture Phase 2 Part 4, Build a High-Performance Culture',
        'Leadership and Culture Phase 2 Part 5, Build and Maintain Relationships That Last',
    ]},
    { name: 'Leadership 3', color: '#14532d', courses: [
        'Leadership and Culture Phase 3 Part 1, Coaching for Higher Performance',
    ]},
    { name: 'Stop the Chaos', color: '#b45309', courses: [
        'Stop the Chaos, Own the Week',
    ]},
    { name: 'KickStart', color: '#9f1239', courses: [
        'KickStart Week 1, Clarity & Identity',
        'KickStart Week 2, Execution & Systems',
        'KickStart Week 3, Mindset',
    ]},
];

const ALL_COURSES = COURSE_GROUPS.flatMap(function(g) { return g.courses; });

var courseGroupIdx    = [];
COURSE_GROUPS.forEach(function(g, gi) { g.courses.forEach(function() { courseGroupIdx.push(gi); }); });

var kickstartGroupIdx = COURSE_GROUPS.findIndex(function(g) { return g.name === 'KickStart'; });

// ── Helpers ────────────────────────────────────────────────────────────────
function norm(str) { return String(str || '').trim().toLowerCase(); }

function parseText(val) {
    if (!val) return '';
    if (typeof val === 'object') return val.Value || val.DisplayName || val.Title || '';
    return String(val);
}

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Group expand state ────────────────────────────────────────────────────
var groupHeaders = [];
var expandedGroups = new Set();

// ── Build table header (runs once) ─────────────────────────────────────────
(function buildHeader() {
    var thead = document.getElementById('t-head');

    var r1 = thead.insertRow();
    ['Client', 'Location', 'Package', 'Senior'].forEach(function(label) {
        var th = document.createElement('th');
        th.className = 'fixed-th';
        th.rowSpan = 5;
        th.textContent = label;
        r1.appendChild(th);
    });
    ['Total Completed', 'Total Booked'].forEach(function(label) {
        var th = document.createElement('th');
        th.className = 'fixed-th';
        th.rowSpan = 5;
        th.style.textAlign = 'center';
        th.style.whiteSpace = 'normal';
        th.style.maxWidth = '85px';
        th.textContent = label;
        r1.appendChild(th);
    });
    var courseSel = document.getElementById('filter-course');
    COURSE_GROUPS.forEach(function(g, gi) {
        var th = document.createElement('th');
        th.className = 'group-th';
        th.colSpan = g.courses.length;
        th.style.background = g.color;
        th.textContent = g.name + ' ▸';
        th.addEventListener('click', function() { toggleGroup(gi); });
        groupHeaders.push(th);
        r1.appendChild(th);

        var optgroup = document.createElement('optgroup');
        optgroup.label = g.name;
        g.courses.forEach(function(course) {
            var opt = document.createElement('option');
            opt.value = course;
            opt.textContent = course.split(',').pop().trim();
            optgroup.appendChild(opt);
        });
        courseSel.appendChild(optgroup);
    });

    var r2 = thead.insertRow(); // completed counts
    var r3 = thead.insertRow(); // booked counts
    var r4 = thead.insertRow(); // not completed counts
    var r5 = thead.insertRow(); // session numbers
    var ci = 0;
    COURSE_GROUPS.forEach(function(g, gi) {
        g.courses.forEach(function(course, i) {
            var thDone = document.createElement('th');
            thDone.className = 'count-th count-th-done grp-col-' + gi;
            thDone.id = 'grp-done-' + ci;
            thDone.title = 'Completed';
            thDone.textContent = '0';
            r2.appendChild(thDone);

            var thBook = document.createElement('th');
            thBook.className = 'count-th count-th-book grp-col-' + gi;
            thBook.id = 'grp-book-' + ci;
            thBook.title = 'Booked';
            thBook.textContent = '0';
            r3.appendChild(thBook);

            var thNotComp = document.createElement('th');
            thNotComp.className = 'count-th count-th-notcomp grp-col-' + gi;
            thNotComp.id = 'grp-notcomp-' + ci;
            thNotComp.title = 'Not Completed';
            thNotComp.textContent = '0';
            r4.appendChild(thNotComp);

            var thSession = document.createElement('th');
            thSession.className = 'session-th grp-col-' + gi;
            thSession.title = course;
            thSession.textContent = i + 1;
            thSession.dataset.shortName = course.split(',').pop().trim();
            r5.appendChild(thSession);

            ci++;
        });
    });
})();

// ── Filter state ───────────────────────────────────────────────────────────
var _dashData = null;

function applyFilter(seniorFilter) {
    if (!_dashData) return;
    var clients     = _dashData.clients;
    var completedMap = _dashData.completedMap;
    var bookedMap    = _dashData.bookedMap;

    var sf = (seniorFilter || '').trim();
    var lf = (document.getElementById('filter-location').value || '').trim();
    var cf = (document.getElementById('filter-course').value || '').trim();
    var compFilter = (document.getElementById('filter-completion').value || '').trim();

    var ksYear = new Date().getFullYear();

    var filtered = clients
        .filter(function(c) { return !sf || (c.Senior || '') === sf; })
        .filter(function(c) { return !lf || parseText(c.Location) === lf; });

    var rows = filtered.map(function(c) {
        var clientNorm = norm(c.Title);
        var completed  = completedMap[clientNorm] || new Map();
        var booked     = bookedMap[clientNorm]    || new Map();

        var doneCount   = 0;
        var bookedCount = 0;
        var courseCounts = ALL_COURSES.map(function() { return { done: 0, booked: 0 }; });

        var sessionCells = ALL_COURSES.map(function(course, ci) {
            var gi  = courseGroupIdx[ci];
            var cls = 'session-td grp-col-' + gi + ' course-col-' + ci;
            var isKs = gi === kickstartGroupIdx;

            var hasCompleted = completed.has(course);
            var hasBooked    = booked.has(course);

            if (isKs) {
                if (hasCompleted) {
                    var ksInfo = completed.get(course) || {};
                    var yr = parseInt((ksInfo.date || '').split('/')[2]) || 0;
                    hasCompleted = yr === ksYear;
                }
                if (hasBooked) {
                    var yr = parseInt((booked.get(course) || '').split('/')[2]) || 0;
                    hasBooked = yr === ksYear;
                }
            }

            if (hasCompleted) {
                var info   = completed.get(course) || {};
                var status = info.status || 'complete';
                var d  = escapeHtml(info.date || '');
                var cl = escapeHtml(c.Title);
                var cr = escapeHtml(course);
                if (status === 'dna') {
                    return '<td class="' + cls + '"><span class="cross" data-date="' + d + '" data-type="Did not attend" data-client="' + cl + '" data-course="' + cr + '">&#10007;</span></td>';
                }
                doneCount++;
                courseCounts[ci].done++;
                return '<td class="' + cls + '"><span class="tick" data-date="' + d + '" data-type="Completed" data-client="' + cl + '" data-course="' + cr + '">&#10003;</span></td>';
            }
            if (hasBooked) {
                bookedCount++;
                courseCounts[ci].booked++;
                var d  = escapeHtml(booked.get(course) || '');
                var cl = escapeHtml(c.Title);
                var cr = escapeHtml(course);
                return '<td class="' + cls + '"><span class="dot" data-date="' + d + '" data-type="Booked" data-client="' + cl + '" data-course="' + cr + '">&middot;</span></td>';
            }
            if (isKs && completed.has(course)) {
                var prevInfo = completed.get(course) || {};
                var prevDate = escapeHtml(prevInfo.date || '');
                return '<td class="' + cls + ' ks-prior" title="Previously attended ' + prevDate + '"></td>';
            }
            return '<td class="' + cls + '"></td>';
        }).join('');

        var html = '<tr>'
            + '<td>' + escapeHtml(c.Title)                + '</td>'
            + '<td>' + escapeHtml(parseText(c.Location))  + '</td>'
            + '<td>' + escapeHtml(parseText(c.Package))   + '</td>'
            + '<td>' + escapeHtml(c.Senior || '')         + '</td>'
            + '<td style="text-align:center">' + (doneCount   ? '<span class="count-done">' + doneCount   + '</span>' : '') + '</td>'
            + '<td style="text-align:center">' + (bookedCount ? '<span class="count-book">' + bookedCount + '</span>' : '') + '</td>'
            + sessionCells
            + '</tr>';

        var courseMatch = true;
        if (cf) {
            var info        = completed.get(cf) || {};
            var isCompleted = completed.has(cf) && (info.status || 'complete') !== 'dna';
            if (compFilter === 'completed') {
                courseMatch = isCompleted;
            } else if (compFilter === 'notcompleted') {
                courseMatch = !isCompleted;
            } else {
                courseMatch = completed.has(cf) || booked.has(cf);
            }
        }

        return { html: html, courseMatch: courseMatch, courseCounts: courseCounts };
    });

    var visible = !cf ? rows : rows.filter(function(r) { return r.courseMatch; });

    document.getElementById('t-body').innerHTML = visible.map(function(r) { return r.html; }).join('');

    ALL_COURSES.forEach(function(course, ci) {
        var totals = { done: 0, booked: 0 };
        visible.forEach(function(r) {
            totals.done   += r.courseCounts[ci].done;
            totals.booked += r.courseCounts[ci].booked;
        });
        var notCompleted = visible.length - totals.done - totals.booked;
        document.getElementById('grp-done-'    + ci).textContent = totals.done;
        document.getElementById('grp-book-'    + ci).textContent = totals.booked;
        document.getElementById('grp-notcomp-' + ci).textContent = notCompleted;
    });

    var countEl = document.getElementById('client-count');
    countEl.textContent = visible.length + ' client' + (visible.length !== 1 ? 's' : '')
        + (sf ? ' · ' + sf : '');
}

// ── Flow fetch ─────────────────────────────────────────────────────────────
async function callFlow(url) {
    var res = await fetch(url, { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    return res.json();
}

// ── Load data ──────────────────────────────────────────────────────────────
async function loadAll() {
    try {
        var flowUrl = typeof CLIENTS_FLOW_URL !== 'undefined' ? CLIENTS_FLOW_URL : '';
        if (!flowUrl) {
            document.getElementById('state-loading').innerHTML =
                '<p style="color:#92400e;background:#fffbeb;border:1px solid #fcd34d;padding:12px 16px;border-radius:6px">'
                + 'config.js not loaded — CLIENTS_FLOW_URL is missing.</p>';
            return;
        }

        var data = await callFlow(flowUrl);

        var clients = (data.clients || []).slice().sort(function(a, b) {
            return norm(a.Title).localeCompare(norm(b.Title));
        });

        var attended = data.attended || [];
        var booked   = data.booked   || [];

        // completed map: normalisedClientName → Map(courseName → { date, status })
        var completedMap = {};
        attended.forEach(function(row) {
            var client = norm(row.clientname_attended);
            var course = row.course_attended;
            var date   = fmtDate(row.course_date_attended || '');
            var status = (row.course_status || '').toLowerCase();
            if (!client || !course) return;
            if (!completedMap[client]) completedMap[client] = new Map();
            completedMap[client].set(course, { date: date, status: status });
        });

        // booked map: normalisedClientName → Map(courseName → formattedDate)
        var bookedMap = {};
        booked.forEach(function(row) {
            var client = norm(row.client);
            var course = row.course;
            var date   = fmtDate(row.course_date || '');
            if (!client || !course) return;
            if (!bookedMap[client]) bookedMap[client] = new Map();
            bookedMap[client].set(course, date);
        });

        // populate location dropdown
        var locations = [...new Set(clients.map(function(c) { return parseText(c.Location); }).filter(Boolean))].sort();
        var locSel = document.getElementById('filter-location');
        locations.forEach(function(loc) {
            var opt = document.createElement('option');
            opt.value = opt.textContent = loc;
            locSel.appendChild(opt);
        });

        // populate senior dropdown
        var seniors = [...new Set(clients.map(function(c) { return c.Senior; }).filter(Boolean))].sort();
        var sel = document.getElementById('filter-senior');
        seniors.forEach(function(name) {
            var opt = document.createElement('option');
            opt.value = opt.textContent = name;
            sel.appendChild(opt);
        });

        _dashData = { clients: clients, completedMap: completedMap, bookedMap: bookedMap };
        applyFilter('');

        document.getElementById('state-loading').style.display = 'none';
        document.getElementById('state-table').style.display  = 'block';
        requestAnimationFrame(updateStickyOffsets);

    } catch (err) {
        document.getElementById('state-loading').style.display = 'none';
        var errEl = document.getElementById('state-error');
        errEl.style.display = 'block';
        errEl.textContent = 'Could not load data: ' + err.message;
    }
}

// ── Clear filters ─────────────────────────────────────────────────────────
function clearFilters() {
    document.getElementById('filter-location').value   = '';
    document.getElementById('filter-course').value     = '';
    document.getElementById('filter-completion').value = '';
    document.getElementById('filter-completion').style.display = 'none';
    document.getElementById('filter-senior').value     = '';
    applyFilter('');
}

// ── Course filter change ───────────────────────────────────────────────────
function onCourseFilterChange() {
    var cf      = document.getElementById('filter-course').value;
    var compSel = document.getElementById('filter-completion');
    compSel.style.display = cf ? '' : 'none';
    if (!cf) compSel.value = '';
    applyFilter(document.getElementById('filter-senior').value);
}

// ── Group toggle ───────────────────────────────────────────────────────────
function toggleGroup(gi) {
    var th         = groupHeaders[gi];
    var g          = COURSE_GROUPS[gi];
    var sessionThs = document.querySelectorAll('th.session-th.grp-col-' + gi);
    if (expandedGroups.has(gi)) {
        expandedGroups.delete(gi);
        th.textContent = g.name + ' ▸';
        sessionThs.forEach(function(el, i) {
            el.textContent = i + 1;
            el.classList.remove('expanded');
        });
    } else {
        expandedGroups.add(gi);
        th.textContent = g.name + ' ▾';
        sessionThs.forEach(function(el) {
            el.textContent = el.dataset.shortName;
            el.classList.add('expanded');
        });
    }
    requestAnimationFrame(updateStickyOffsets);
}

// ── Sticky header offsets ────────────────────────────────────────────────
function updateStickyOffsets() {
    var theadRows = document.querySelectorAll('#t-head tr');
    if (theadRows.length < 4) return;
    var cum = 0;
    for (var i = 0; i < 4; i++) {
        cum += theadRows[i].getBoundingClientRect().height;
        document.documentElement.style.setProperty('--r' + (i + 1) + 'h', cum + 'px');
    }

    var firstTh = theadRows[0].children[0];
    if (firstTh) {
        document.documentElement.style.setProperty('--c1w', firstTh.getBoundingClientRect().width + 'px');
    }
}
window.addEventListener('resize', updateStickyOffsets);

// ── Group counter helpers ────────────────────────────────────────────────
function courseIndexOfCell(el) {
    var td = el.closest('td');
    var m = td && td.className.match(/course-col-(\d+)/);
    return m ? parseInt(m[1], 10) : -1;
}
function adjustGroupCount(ci, type, delta) {
    if (ci < 0) return;
    var el = document.getElementById('grp-' + type + '-' + ci);
    if (!el) return;
    el.textContent = Math.max(0, parseInt(el.textContent, 10) + delta);
}

// ── Date formatting ────────────────────────────────────────────────────────
function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d);
    return dt.getDate().toString().padStart(2, '0') + '/'
         + (dt.getMonth() + 1).toString().padStart(2, '0') + '/'
         + dt.getFullYear();
}

// ── Hover tooltip ─────────────────────────────────────────────────────────
var _tipEl = document.getElementById('tooltip');
var _tipOn  = false;

function _tipShow(text, e) { _tipEl.textContent = text; _tipEl.style.display = 'block'; _tipOn = true; _tipMove(e); }
function _tipHide() { _tipEl.style.display = 'none'; _tipOn = false; }
function _tipMove(e) { _tipEl.style.left = (e.clientX + 14) + 'px'; _tipEl.style.top = (e.clientY - 36) + 'px'; }

document.getElementById('t-body').addEventListener('mouseover', function(e) {
    var el = e.target;
    if (el.classList.contains('tick') || el.classList.contains('dot') || el.classList.contains('cross')) {
        var type = el.dataset.type || (el.classList.contains('tick') ? 'Completed' : el.classList.contains('cross') ? 'Did not attend' : 'Booked');
        var date = el.dataset.date;
        _tipShow(type + (date ? ' ' + date : ''), e);
    }
});
document.getElementById('t-body').addEventListener('mouseout', function(e) {
    var el = e.target;
    if (el.classList.contains('tick') || el.classList.contains('dot') || el.classList.contains('cross')) _tipHide();
});
document.addEventListener('mousemove', function(e) { if (_tipOn) _tipMove(e); });

// ── Write flow ────────────────────────────────────────────────────────────
function callWriteFlow(params) {
    var url = typeof WRITE_FLOW_URL !== 'undefined' ? WRITE_FLOW_URL : '';
    if (!url) return Promise.reject(new Error('WRITE_FLOW_URL not configured'));
    var qs = Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(url + '&' + qs, { method: 'POST' });
}

function updateRowCounts(row) {
    var ticks = row.querySelectorAll('.tick').length;
    var dots  = row.querySelectorAll('.dot').length;
    var cells = row.querySelectorAll('td');
    cells[4].innerHTML = ticks ? '<span class="count-done">' + ticks + '</span>' : '';
    cells[5].innerHTML = dots  ? '<span class="count-book">' + dots  + '</span>' : '';
}

// ── Action popup ──────────────────────────────────────────────────────────
var _popupEl      = null;
var _activeDot    = null;
var _activeDotData = null;

function showPopup(dotEl, e) {
    _activeDot     = dotEl;
    _activeDotData = { client: dotEl.dataset.client, course: dotEl.dataset.course };
    var rect = dotEl.getBoundingClientRect();
    var top  = rect.bottom + 6;
    var left = rect.left;
    if (left + 220 > window.innerWidth) left = window.innerWidth - 225;
    if (top  + 70  > window.innerHeight) top = rect.top - 76;
    _popupEl.style.top     = top  + 'px';
    _popupEl.style.left    = left + 'px';
    _popupEl.style.display = 'block';
    e.stopPropagation();
}

function hidePopup() {
    if (_popupEl) _popupEl.style.display = 'none';
    _activeDot     = null;
    _activeDotData = null;
}

document.addEventListener('click', function(e) {
    if (_popupEl && _popupEl.style.display === 'block' && !_popupEl.contains(e.target)) {
        hidePopup();
    }
});

// ── Row click handler ─────────────────────────────────────────────────────
document.getElementById('t-body').addEventListener('click', async function(e) {
    var el  = e.target;
    var row = el.closest('tr');
    if (!row) return;

    if (el.classList.contains('dot')) {
        showPopup(el, e);

    } else if (el.classList.contains('tick')) {
        var client = el.dataset.client;
        var course = el.dataset.course;
        if (!client) return;
        var ci = courseIndexOfCell(el);
        el.style.opacity = '0.35';
        try {
            var res = await callWriteFlow({ action: 'uncomplete', clientName: client, course: course });
            if (res && !res.ok) throw new Error('HTTP ' + res.status);
            el.className    = 'dot';
            el.dataset.type = 'Booked';
            el.dataset.date = '';
            el.innerHTML    = '&middot;';
            updateRowCounts(row);
            adjustGroupCount(ci, 'done', -1);
            adjustGroupCount(ci, 'book', 1);
        } catch (err) {
            alert('Could not save: ' + err.message);
        }
        el.style.opacity = '';

    } else if (el.classList.contains('cross')) {
        var client = el.dataset.client;
        var course = el.dataset.course;
        if (!client) return;
        var ci = courseIndexOfCell(el);
        el.style.opacity = '0.35';
        try {
            var res = await callWriteFlow({ action: 'undna', clientName: client, course: course });
            if (res && !res.ok) throw new Error('HTTP ' + res.status);
            el.className    = 'dot';
            el.dataset.type = 'Booked';
            el.dataset.date = '';
            el.innerHTML    = '&middot;';
            updateRowCounts(row);
            adjustGroupCount(ci, 'notcomp', -1);
            adjustGroupCount(ci, 'book', 1);
        } catch (err) {
            alert('Could not save: ' + err.message);
        }
        el.style.opacity = '';
    }
});

document.addEventListener('DOMContentLoaded', function() {
    _popupEl = document.getElementById('action-popup');

    document.getElementById('popup-complete').addEventListener('click', async function() {
        if (!_activeDot) return;
        var el     = _activeDot;
        var row    = el.closest('tr');
        var client = _activeDotData.client;
        var course = _activeDotData.course;
        var today  = fmtDate(new Date().toISOString());
        var ci     = courseIndexOfCell(el);
        hidePopup();
        el.style.opacity = '0.35';
        try {
            var res = await callWriteFlow({ action: 'complete', clientName: client, course: course, courseDate: today });
            if (res && !res.ok) throw new Error('HTTP ' + res.status);
            el.className    = 'tick';
            el.dataset.type = 'Completed';
            el.dataset.date = today;
            el.innerHTML    = '&#10003;';
            if (row) updateRowCounts(row);
            adjustGroupCount(ci, 'book', -1);
            adjustGroupCount(ci, 'done', 1);
        } catch (err) {
            alert('Could not save: ' + err.message);
        }
        el.style.opacity = '';
    });

    document.getElementById('popup-dna').addEventListener('click', async function() {
        if (!_activeDot) return;
        var el     = _activeDot;
        var row    = el.closest('tr');
        var client = _activeDotData.client;
        var course = _activeDotData.course;
        var ci     = courseIndexOfCell(el);
        hidePopup();
        el.style.opacity = '0.35';
        try {
            var res = await callWriteFlow({ action: 'dna', clientName: client, course: course });
            if (res && !res.ok) throw new Error('HTTP ' + res.status);
            el.className    = 'cross';
            el.dataset.type = 'Did not attend';
            el.dataset.date = '';
            el.innerHTML    = '&#10007;';
            if (row) updateRowCounts(row);
            adjustGroupCount(ci, 'book', -1);
            adjustGroupCount(ci, 'notcomp', 1);
        } catch (err) {
            alert('Could not save: ' + err.message);
        }
        el.style.opacity = '';
    });

    loadAll();
});

</script>
